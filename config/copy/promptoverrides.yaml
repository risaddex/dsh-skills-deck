# config/copy/promptoverrides.yaml —— 界面词表 —— 设置页「提示词改写」分组（#100）
#
# 这一族只服务设置页里「每个动作按钮一个输入框」的那一组：分组标题与说明、每颗按钮的名字、
# 保存与恢复默认的按钮、以及保存失败时说清原因的几句话。真源与写法约定同 config/copy/flow.yaml：
#   · 每种语言一段，同一段里每个键都要有；值一律是字符串。
#   · {name} 是占位符，由界面渲染处替换；同一键的中英两份占位符必须一字不差。
#   · 想改界面上的字：改这里 → 跑 node scripts/generate-locale-config.mts → 重新构建。
# 注意：这里的「占位符」有两种，别混：上面说的 {names} 是界面文案自己的填空；
#   「po.placeholders」这类句子里列出来给人看的 {url}、{title} 是提示词里的占位符，它们由代码拼进 {names}，不写在本文件里。

zh:
  po.title: 提示词改写
  po.desc: 每个动作按钮点下去注入的提示词，默认用插件自带的文本。在下面改某一格并保存，这个按钮就改用你写的文本；点「恢复默认」回到自带文本。改写对所有语言生效，只存在本机设置文件里。
  po.placeholders: 可以使用的占位符：{names}
  po.required: 必须保留：{names}
  po.custom: 已改写
  po.save: 保存
  po.restore: 恢复默认
  po.saved: 提示词已保存
  po.restored: 已恢复为默认文本
  po.inactive: 这一格存着的文字没有生效，按钮仍用默认文本：{why}
  po.errUnknown: 含有未知的占位符：{names}
  po.errMissing: 缺少必须保留的占位符：{names}
  po.errReadonly: 保存失败：本机设置文件是更高版本插件写的，当前插件不许写回去
  po.errUnavailable: 保存失败：读不到本机设置文件，请稍后重试
  po.errGeneric: 保存失败，请重试
  po.name.mapInspect: 地图：检查（0/0 地图）
